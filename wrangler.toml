name = "matri"
compatibility_date = "2024-09-23"
main = "./src/worker.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "matri-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "matri-photos"
