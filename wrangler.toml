name = "matri"
compatibility_date = "2024-09-23"
main = "./src/worker.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "matri-db"
# Replace with the id printed by `wrangler d1 create matri-db` (see README).
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "matri-photos"
